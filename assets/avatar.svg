<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#0f2419"/>
      <stop offset="55%" stop-color="#081810"/>
      <stop offset="100%" stop-color="#020604"/>
    </radialGradient>
    <linearGradient id="coat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1f22"/>
      <stop offset="100%" stop-color="#050607"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d3ab8b"/>
      <stop offset="100%" stop-color="#b3835f"/>
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2420"/>
      <stop offset="100%" stop-color="#0e0c0a"/>
    </linearGradient>
    <linearGradient id="lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3d2e"/>
      <stop offset="55%" stop-color="#08130d"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3ef58a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3ef58a" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="248"/>
    </clipPath>
  </defs>

  <circle cx="256" cy="256" r="248" fill="url(#bg)"/>

  <g clip-path="url(#circleClip)" opacity="0.55">
    <!-- "chuva de código" -->
    <g stroke="#2ee878" stroke-width="3" stroke-linecap="round">
      <line x1="46"  y1="10"  x2="46"  y2="150" opacity="0.5"/>
      <line x1="86"  y1="60"  x2="86"  y2="260" opacity="0.35"/>
      <line x1="128" y1="0"   x2="128" y2="120" opacity="0.6"/>
      <line x1="392" y1="20"  x2="392" y2="180" opacity="0.4"/>
      <line x1="432" y1="70"  x2="432" y2="230" opacity="0.55"/>
      <line x1="466" y1="0"   x2="466" y2="140" opacity="0.35"/>
      <line x1="60"  y1="360" x2="60"  y2="512" opacity="0.4"/>
      <line x1="20"  y1="300" x2="20"  y2="440" opacity="0.3"/>
      <line x1="452" y1="330" x2="452" y2="512" opacity="0.45"/>
      <line x1="490" y1="280" x2="490" y2="420" opacity="0.3"/>
    </g>
  </g>

  <circle cx="256" cy="256" r="248" fill="none" stroke="#2ee878" stroke-width="2" opacity="0.25"/>

  <!-- ombros / trench coat de gola alta e pontuda -->
  <path d="M 96 512 C 96 388 160 332 256 332 C 352 332 416 388 416 512 Z" fill="url(#coat)"/>
  <path d="M 172 512 C 174 428 208 378 256 372 C 304 378 338 428 340 512 Z" fill="#0b0d0e"/>
  <path d="M 216 374 L 256 452 L 296 374 C 282 366 268 362 256 362 C 244 362 230 366 216 374 Z" fill="#171b1d"/>

  <!-- pescoço -->
  <rect x="228" y="300" width="56" height="60" rx="18" fill="url(#skin)"/>

  <!-- cabeça -->
  <ellipse cx="256" cy="230" rx="98" ry="108" fill="url(#skin)"/>

  <!-- orelhas -->
  <ellipse cx="152" cy="238" rx="14" ry="20" fill="url(#skin)"/>
  <ellipse cx="360" cy="238" rx="14" ry="20" fill="url(#skin)"/>

  <!-- cabelo curto e desalinhado -->
  <path d="M 154 200
           C 148 140 195 108 256 108
           C 317 108 364 140 358 200
           C 356 176 340 160 320 172
           C 322 152 300 138 280 148
           C 276 132 244 130 234 146
           C 214 134 190 148 190 168
           C 170 158 152 172 154 200 Z" fill="url(#hair)"/>
  <path d="M 160 196 C 158 178 166 162 180 154" stroke="#050403" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M 352 196 C 354 178 346 162 332 154" stroke="#050403" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- sobrancelhas -->
  <path d="M 188 200 Q 210 190 232 198" stroke="#1c130f" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 280 198 Q 302 190 324 200" stroke="#1c130f" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- óculos redondos estilo Neo -->
  <g>
    <path d="M 176 212 L 336 212" stroke="#05070a" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="212" cy="228" rx="42" ry="34" fill="url(#lens)" stroke="#000" stroke-width="4"/>
    <ellipse cx="300" cy="228" rx="42" ry="34" fill="url(#lens)" stroke="#000" stroke-width="4"/>
    <path d="M 190 220 L 216 220" stroke="#3ef58a" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
    <path d="M 278 220 L 304 220" stroke="#3ef58a" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
    <path d="M 130 224 L 170 220" stroke="#05070a" stroke-width="8" stroke-linecap="round"/>
    <path d="M 382 224 L 342 220" stroke="#05070a" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- nariz (sutil, só a sombra da base) -->
  <path d="M 246 268 Q 256 276 266 268" stroke="#a37854" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- boca -->
  <path d="M 230 300 Q 256 308 282 300" stroke="#7a4f38" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- brilho de contorno (rim light) -->
  <path d="M 168 260 C 160 200 195 130 256 122" stroke="#3ef58a" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.35"/>

  <circle cx="256" cy="256" r="248" fill="none" stroke="#3ef58a" stroke-width="4" opacity="0.55"/>
</svg>
