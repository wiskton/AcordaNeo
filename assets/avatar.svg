<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#0f2419"/>
      <stop offset="55%" stop-color="#081810"/>
      <stop offset="100%" stop-color="#020604"/>
    </radialGradient>
    <linearGradient id="coat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1f22"/>
      <stop offset="100%" stop-color="#050607"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4033"/>
      <stop offset="100%" stop-color="#3c2a21"/>
    </linearGradient>
    <linearGradient id="lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3d2e"/>
      <stop offset="55%" stop-color="#08130d"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3ef58a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3ef58a" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="248"/>
    </clipPath>
  </defs>

  <circle cx="256" cy="256" r="248" fill="url(#bg)"/>

  <g clip-path="url(#circleClip)" opacity="0.55">
    <!-- "chuva de código" -->
    <g stroke="#2ee878" stroke-width="3" stroke-linecap="round">
      <line x1="46"  y1="10"  x2="46"  y2="150" opacity="0.5"/>
      <line x1="86"  y1="60"  x2="86"  y2="260" opacity="0.35"/>
      <line x1="128" y1="0"   x2="128" y2="120" opacity="0.6"/>
      <line x1="392" y1="20"  x2="392" y2="180" opacity="0.4"/>
      <line x1="432" y1="70"  x2="432" y2="230" opacity="0.55"/>
      <line x1="466" y1="0"   x2="466" y2="140" opacity="0.35"/>
      <line x1="60"  y1="360" x2="60"  y2="512" opacity="0.4"/>
      <line x1="20"  y1="300" x2="20"  y2="440" opacity="0.3"/>
      <line x1="452" y1="330" x2="452" y2="512" opacity="0.45"/>
      <line x1="490" y1="280" x2="490" y2="420" opacity="0.3"/>
    </g>
  </g>

  <circle cx="256" cy="256" r="248" fill="none" stroke="#2ee878" stroke-width="2" opacity="0.25"/>

  <!-- ombros / casaco de gola alta -->
  <path d="M 96 512 C 96 388 160 332 256 332 C 352 332 416 388 416 512 Z" fill="url(#coat)"/>
  <path d="M 176 512 C 178 430 210 380 256 372 C 302 380 334 430 336 512 Z" fill="#0b0d0e"/>
  <path d="M 224 372 L 256 420 L 288 372 C 278 366 266 362 256 362 C 246 362 234 366 224 372 Z" fill="#161a1c"/>

  <!-- pescoço -->
  <rect x="228" y="300" width="56" height="60" rx="18" fill="url(#skin)"/>

  <!-- cabeça (careca) -->
  <ellipse cx="256" cy="230" rx="98" ry="108" fill="url(#skin)"/>
  <path d="M 158 230 C 158 165 200 118 256 118 C 312 118 354 165 354 230 C 354 205 320 190 256 190 C 192 190 158 205 158 230 Z" fill="#2a1c16" opacity="0.35"/>

  <!-- orelhas -->
  <ellipse cx="152" cy="238" rx="14" ry="20" fill="url(#skin)"/>
  <ellipse cx="360" cy="238" rx="14" ry="20" fill="url(#skin)"/>

  <!-- sobrancelhas -->
  <path d="M 186 196 Q 210 184 234 194" stroke="#1c130f" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M 278 194 Q 302 184 326 196" stroke="#1c130f" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- óculos estilo Matrix -->
  <g>
    <path d="M 150 214 L 362 214 L 356 236 C 340 226 300 220 256 220 C 212 220 172 226 156 236 Z" fill="#05070a"/>
    <rect x="160" y="208" width="88" height="52" rx="22" fill="url(#lens)" stroke="#000" stroke-width="3"/>
    <rect x="264" y="208" width="88" height="52" rx="22" fill="url(#lens)" stroke="#000" stroke-width="3"/>
    <path d="M 182 222 L 220 222" stroke="#3ef58a" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
    <path d="M 286 222 L 324 222" stroke="#3ef58a" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
    <path d="M 118 220 L 160 224" stroke="#05070a" stroke-width="10" stroke-linecap="round"/>
    <path d="M 394 220 L 352 224" stroke="#05070a" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- nariz (sutil, só a sombra da base) -->
  <path d="M 246 262 Q 256 270 266 262" stroke="#2a1c16" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- cavanhaque (contorna o queixo, por baixo da boca) -->
  <path d="M 206 270
           C 204 292 210 320 232 336
           C 240 341 248 344 256 344
           C 264 344 272 341 280 336
           C 302 320 308 292 306 270
           C 300 288 286 306 256 306
           C 226 306 212 288 206 270 Z" fill="#171010"/>
  <path d="M 210 262 C 208 280 210 296 218 310" stroke="#171010" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M 302 262 C 304 280 302 296 294 310" stroke="#171010" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.9"/>

  <!-- boca -->
  <path d="M 232 298 Q 256 306 280 298" stroke="#0d0908" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- brilho de contorno (rim light) -->
  <path d="M 168 260 C 160 200 195 130 256 122" stroke="#3ef58a" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.35"/>

  <circle cx="256" cy="256" r="248" fill="none" stroke="#3ef58a" stroke-width="4" opacity="0.55"/>
</svg>
